# 共用模板
x-app: &x-app
  build: .
  volumes:
    - .:/app
    - /app/.venv
  depends_on:
    - pgbouncer
    - redis
  env_file:
    - .env
  environment:
    - DB_HOST=pgbouncer
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
  networks:
    - find_coffee_network
  restart: always

services:
  db:
    container_name: find-coffee-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - find_coffee_network
    restart: always

  pgbouncer:
    container_name: find-coffee-pgbouncer
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_DB_CONNECTIONS=20
      - DEFAULT_POOL_SIZE=10
      - AUTH_TYPE=md5
    depends_on:
      - db
    networks:
      - find_coffee_network
    restart: always

  redis:
    container_name: find-coffee-redis
    image: redis:7
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - find_coffee_network
    restart: always

  nginx:
    container_name: find-coffee-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - find_coffee_network
    restart: always

  web:
    <<: *x-app
    container_name: find-coffee-web
    expose:
      - "8000"

  celery:
    <<: *x-app
    container_name: find-coffee-celery
    command: uv run --no-sync celery -A core worker -l info

networks:
  find_coffee_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
