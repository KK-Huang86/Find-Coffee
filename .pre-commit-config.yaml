default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace      # 移除行尾空格
      - id: end-of-file-fixer        # 確保檔案結尾有換行
      - id: mixed-line-ending        # 統一換行符號
  - repo: local
    hooks:
      - id: rag-ingest
        name: 同步 SDD 文件至 AnythingLLM RAG
        entry: uv run python scripts/rag_ingest.py
        language: system
        stages: [post-commit]
        pass_filenames: false
        always_run: true
