name: Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: ENV=prod
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/find_coffee:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: KK-Huang86/Find_Coffee-infra
          token: ${{ secrets.GH_PAT }}
          path: infra

      - name: Update image tag in infra
        run: |
          SHA=${{ steps.vars.outputs.sha_short }}
          sed -i "s|vup4k0806/find_coffee:[0-9a-f]*|vup4k0806/find_coffee:${SHA}|g" infra/web/deployment.yml
          sed -i "s|vup4k0806/find_coffee:[0-9a-f]*|vup4k0806/find_coffee:${SHA}|g" infra/celery/deployment.yml
          cd infra
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add web/deployment.yml celery/deployment.yml
          git diff --cached --quiet || git commit -m "chore: update web and celery image to ${SHA}"
          git push
